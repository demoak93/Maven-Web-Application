name: Maven CI/CD
on:
  push:
    branches:
      - master
jobs: 
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
      - name: Setup java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8
          cache: maven
      - name: Verify Java version
        run: java -version
      - name: Verify Maven version
        run: mvn -version
      - name: Build Maven Project
        run: mvn clean package
      - name: List packaged file
        run: ls -l target
      - name: Build Docker Image
        run: docker build -t maven-web-application:latest .
      - name: Verify Images
        run: docker images
      - name: Login to docker hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Tag docker image
        run: |
          docker tag maven-web-application:latest ${{ secrets.DOCKER_USERNAME }}/maven-web-application:latest
          docker tag maven-web-application:latest ${{ secrets.DOCKER_USERNAME }}/maven-web-application:${{ github.sha }}
      - name: Verify tags
        run: docker images
      - name: Push latest image to docker hub
        run: docker push ${{ secrets.DOCKER_USERNAME }}/maven-web-application:latest
      - name: Push commit SHA image to dockerhub
        run: docker push ${{ secrets.DOCKER_USERNAME }}/maven-web-application:${{ github.sha }}
        
      
      
